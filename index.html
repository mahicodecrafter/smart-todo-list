<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks</title>
  <meta name="description" content="A minimal, fast, and responsive daily task manager.">
  <meta name="theme-color" content="#ffffff">

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app-layout">
    <!-- Header -->
    <header class="app-header">
      <div class="header-meta">
        <h1 class="header-title">Tasks</h1>
        <p class="header-date" id="currentDate"></p>
      </div>

      <div class="header-actions">
        <!-- Theme Toggle -->
        <button id="themeToggleBtn" class="btn-icon" aria-label="Toggle color theme" title="Toggle theme">
          <svg class="icon-theme-dark" viewBox="0 0 20 20" fill="currentColor">
            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
          </svg>
          <svg class="icon-theme-light" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Progress Bar (Minimal Hairline Indicator) -->
    <div class="progress-bar-wrap" id="progressBarWrap" style="display: none;">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
      <div class="progress-info">
        <span id="progressSummary">0 of 0 completed</span>
        <span id="progressPercent">0%</span>
      </div>
    </div>

    <!-- Task Creation Input -->
    <form class="task-form" id="taskForm" onsubmit="return false;">
      <div class="input-wrapper">
        <input 
          type="text" 
          id="taskInput" 
          class="task-input" 
          placeholder="Add a new task..." 
          autocomplete="off" 
          autofocus
        >
        
        <!-- Priority Selector (Subtle Flag Button) -->
        <div class="input-controls">
          <div class="priority-picker">
            <button type="button" id="priorityPickerBtn" class="picker-btn" title="Set priority" aria-label="Set priority">
              <svg viewBox="0 0 16 16" fill="currentColor">
                <path d="M3 2v12h1.5V9.5H13l-2-3.5 2-3.5H4.5V2H3z"/>
              </svg>
              <span id="priorityLabel" class="priority-tag"></span>
            </button>
            <div id="priorityMenu" class="priority-dropdown" style="display: none;">
              <button type="button" class="priority-option" data-prio="none">None</button>
              <button type="button" class="priority-option" data-prio="low">Low</button>
              <button type="button" class="priority-option" data-prio="medium">Medium</button>
              <button type="button" class="priority-option" data-prio="high">High</button>
            </div>
          </div>

          <button type="submit" id="addBtn" class="btn-submit" aria-label="Add task">
            Add
          </button>
        </div>
      </div>
    </form>

    <!-- Filter & Search Toolbar -->
    <div class="toolbar">
      <nav class="filter-group" aria-label="Filter tasks">
        <button class="filter-tab active" data-filter="all">All <span class="tab-count" id="countAll">0</span></button>
        <button class="filter-tab" data-filter="active">Active <span class="tab-count" id="countActive">0</span></button>
        <button class="filter-tab" data-filter="completed">Completed <span class="tab-count" id="countCompleted">0</span></button>
      </nav>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
        </svg>
        <input type="text" id="searchInput" class="search-field" placeholder="Search..." autocomplete="off">
        <button type="button" id="clearSearchBtn" class="btn-clear-search" style="display: none;" aria-label="Clear search">✕</button>
      </div>
    </div>

    <!-- Task List -->
    <ul id="taskList" class="task-list"></ul>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state" style="display: none;">
      <p class="empty-text">No tasks found</p>
    </div>

    <!-- Footer Controls -->
    <footer class="app-footer">
      <span class="footer-hint" id="activeItemsCount">0 items remaining</span>
      <button type="button" id="clearCompletedBtn" class="btn-text" style="display: none;">
        Clear completed
      </button>
    </footer>
  </main>

  <!-- Undo Toast -->
  <div id="toastContainer" class="toast-wrap" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
